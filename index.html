<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kristof Pipeleers — Data Analytics Engineer</title>
    <meta
      name="description"
      content="Kristof Pipeleers is a Data Analytics Engineer in Madrid building trusted data platforms with Microsoft Fabric, dbt and AI agents."
    />
    <link rel="canonical" href="https://kristofpipeleers.be/" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/profile-avatar.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Link previews (LinkedIn, Slack, WhatsApp, …) -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://kristofpipeleers.be/" />
    <meta property="og:title" content="Kristof Pipeleers — Data Analytics Engineer" />
    <meta
      property="og:description"
      content="Data platforms people and AI agents can trust, built on Microsoft Fabric, dbt and Power BI."
    />
    <meta property="og:image" content="https://kristofpipeleers.be/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kristof Pipeleers",
        "jobTitle": "Data Analytics Engineer",
        "url": "https://kristofpipeleers.be",
        "worksFor": { "@type": "Organization", "name": "Sparkle NV", "url": "https://www.sparkle.consulting" },
        "address": { "@type": "PostalAddress", "addressLocality": "Madrid", "addressCountry": "ES" },
        "sameAs": ["https://linkedin.com/in/kristof-pipeleers/", "https://github.com/kristof-pipeleers"]
      }
    </script>

    <!-- Apply the saved/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t === "dark" || (t === null && matchMedia("(prefers-color-scheme: dark)").matches)) d.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
