# Production:  master  → https://kristofpipeleers.be/
# Development: develop → https://kristofpipeleers.be/dev/  (noindex, DEV badge)
#
# GitHub Pages hosts one site per repo, so every run builds BOTH branches and
# publishes them together. The CV PDF is regenerated from content on each build.
name: Deploy

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: master
            script: build
          - branch: develop
            script: build:dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0 # full history, for the "last updated" date of cv.ts

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pdf
      - run: npm run ${{ matrix.script }}
        env:
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.branch }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-master
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: site-develop
          path: site/dev

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
